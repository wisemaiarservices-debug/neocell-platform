openapi: 3.0.3
info:
  title: NeoCell API
  version: 0.2.0
  description: Decision-support API. Current runtime reports input provenance and withholds readiness scores until validated telemetry and models exist.
servers:
  - url: /
paths:
  /health:
    get:
      summary: API process health (not device or telemetry health)
      responses:
        '200':
          description: API process is reachable
  /api/v1/dashboard/summary:
    get:
      summary: Demonstration input summary with provenance
      responses:
        '200':
          description: Summary, provenance and validation limitations
  /api/v1/readiness/analyze:
    post:
      summary: Readiness assessment contract; currently returns not_assessed
      responses:
        '200':
          description: Explicit not-assessed result
        '422':
          description: Invalid input
  /api/v1/plans/run:
    post:
      summary: Planning contract; currently withholds unvalidated actions
      responses:
        '200':
          description: Not estimable result with no operational actions
        '422':
          description: Invalid input
  /api/v1/recommendations/run:
    post:
      summary: Human-review checklist only
      responses:
        '200':
          description: Review-required result
        '422':
          description: Invalid input
